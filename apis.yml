apis:
- aid: peoples-group:peoples-group-interac-etransfer-api
  name: Peoples Group Interac e-Transfer API
  description: >-
    API-driven Interac e-Transfer for Canadian money movement, supporting Send Money,
    Request Money, Receive AutoDeposit, and Receive Question-and-Answer flows so program
    managers and fintech clients can move funds in near real time to and from Canadian
    bank accounts. Access is arranged through a Peoples Group client relationship; no
    public OpenAPI specification is published.
  humanURL: https://www.peoplesgroup.com/fintech/solutions/payments/money-movement
  tags:
  - Interac e-Transfer
  - Real-Time Payments
  - Money Movement
