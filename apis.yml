name: Peoples Group
kind: company
description: >-
  Peoples Group is the operating name of Peoples Trust Company, a Vancouver-based
  Canadian trust company and chartered-bank group founded in 1985 and owned by the
  Triple Five Group. Alongside its mortgage, deposit, and commercial-lending
  businesses, Peoples Group runs a fintech and payments arm that provides embedded
  banking-as-a-service to program managers, fintechs, brokers, and merchants across
  Canada: prepaid and credit card issuing under Visa and Mastercard BIN sponsorship,
  merchant acquiring, trust account services, and API-driven money movement including
  Interac e-Transfer (send, request money, and autodeposit), Electronic Funds Transfer
  (EFT) for CAD and USD debits and credits, bill payment to more than 12,000 Canadian
  billers, and push-to-card payouts via Visa Direct and Mastercard Send. In February
  2026 Peoples Group partnered with Fiserv to build a next-generation, always-on
  payments platform carrying rich ISO 20022 data over direct connections to Canada's
  payment systems, positioning it for Payments Canada's Real-Time Rail. Its APIs are
  real and in production, but access is partnership- and sales-gated: there is no
  public self-serve developer portal, no downloadable OpenAPI/Swagger specification,
  and no public Postman workspace. Integration is arranged through a client
  relationship and the product documentation lives on the corporate fintech site.
