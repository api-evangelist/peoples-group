    url: https://www.peoplesgroup.com/fintech/solutions/payments/money-movement
- aid: peoples-group:peoples-group-eft-api
  name: Peoples Group EFT API
  description: >-
    Electronic Funds Transfer API for pre-authorized debits and credits to and from
    Canadian-domiciled accounts in CAD and USD, used for disbursements, remittances,
    payroll, and loading prepaid cards, with support for individual, batch, and
    recurring transactions. Partnership-gated; no downloadable spec is published.
  humanURL: https://www.peoplesgroup.com/fintech/solutions/payments/money-movement
  tags:
  - EFT
  - ACH
  - Money Movement
  properties:
  - type: Documentation
