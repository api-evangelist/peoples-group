- aid: peoples-group:peoples-group-push-to-card-api
  name: Peoples Group Push-to-Card API (Visa Direct & Mastercard Send)
  description: >-
    Real-time push-to-card disbursements via Visa Direct and Mastercard Send, letting
    clients pay out funds directly to eligible Visa and Mastercard cards for B2B and B2C
    use cases. Built on the card networks' rails and offered to Peoples Group clients;
    no public developer portal or downloadable spec is published.
  humanURL: https://www.peoplesgroup.com/fintech/solutions/payments/money-movement
